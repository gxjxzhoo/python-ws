name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 加载共享变量（env-config）
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: gxjxzhoo/env-config
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .shared-env
          persist-credentials: false

      - name: 应用共享变量
        shell: bash
        run: |
          f=.shared-env/.env
          if [ -f "$f" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|\#*) continue ;; esac
              key="${line%%=*}"; value="${line#*=}"
              [ -z "$value" ] && continue
              echo "::add-mask::$value"
              echo "$key=$value" >> "$GITHUB_ENV"
            done < "$f"
            echo "✅ 已加载 env-config"
          else
            echo "⚠️ 未读到 env-config（检查 PRIVATE_REPO_TOKEN），使用仓库 Secrets"
          fi
          rm -rf .shared-env

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: gxjxzgx
          password: ${{ env.DOCKERHUB_TOKEN || secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gxjxzhoo/python-ws
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Extract metadata (Docker Hub)
        id: meta_hub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/gxjxzgx/python-ws
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
